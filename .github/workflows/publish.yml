name: Publish signed PC release
on:
  repository_dispatch:
    types: [quicklink-pc-release]
  workflow_dispatch:
    inputs:
      release_id:
        description: Prepared public draft release ID
        type: string
        required: true
      manifest_sha256:
        description: SHA-256 of the signed desktop-release.json
        type: string
        required: true
permissions:
  contents: write
concurrency:
  group: quicklink-stable-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify signatures, installers and corresponding vendor sources; publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id || github.event.client_payload.release_id }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 || github.event.client_payload.manifest_sha256 }}
        run: python3 tool/publish_release.py --release-id "$RELEASE_ID" --manifest-sha256 "$MANIFEST_SHA256" --publish
